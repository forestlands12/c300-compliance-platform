# Generic security baseline (CIS-style) for the prototype.
#
# Placeholder until the team confirms the target standard with the supervisor
# (e.g. CIS Benchmarks, a specific CIS level, or another framework). Thresholds
# below follow commonly recommended CIS-style values but have NOT been mapped
# to official benchmark item numbers yet: that mapping is a Phase 1 task.
#
# Each control checks ONE normalised fact (see compliance_checker/collectors.py).
# Operators: eq, ne, gte, lte, between [low, high], in [..], not_in [..]
# platforms: OS (linux, windows) or service tags (nginx, mysql) the control applies to.
# domain: dashboard grouping (identity, remote, network, endpoint, patching, logging, data, web).
# frameworks: INDICATIVE mapping for the dashboard, written by Claude on 28 Oct 2026 from
#   general knowledge of CIS Controls v8 safeguards and PCI DSS v4.0 requirement numbers.
#   It is NOT verified against the official documents. Check every number before it
#   goes in the report (T-05). A PCI number is left out where our threshold is weaker
#   than PCI's (e.g. PW-02 allows 365 days, PCI 8.3.9 says 90).
#
# TODO(Ahmad, T-05): map every control to the chosen CIS Benchmark version's item number.

controls:
  - id: PW-01
    title: Minimum password length is at least 14
    platforms: [linux, windows]
    fact: password.min_length
    operator: gte
    expected: 14
    severity: high
    rationale: Short passwords are quick to brute force.
    remediation:
      linux: Set 'minlen = 14' in /etc/security/pwquality.conf (and PASS_MIN_LEN 14 in /etc/login.defs).
      windows: Set 'Minimum password length' to 14 in Local Security Policy > Account Policies > Password Policy.
    reference: CIS-style password policy (mapping TBD)
    domain: identity
    frameworks: {cis_v8: "5.2", pci_dss_v4: "8.3.6"}

  - id: PW-02
    title: Maximum password age is 1 to 365 days
    platforms: [linux, windows]
    fact: password.max_age_days
    operator: between
    expected: [1, 365]
    severity: medium
    rationale: Passwords that never expire stay valid after a silent compromise.
    remediation:
      linux: Set PASS_MAX_DAYS 365 (or lower) in /etc/login.defs.
      windows: Set 'Maximum password age' to 365 or fewer days, not 0.
    reference: CIS-style password policy (mapping TBD)
    domain: identity
    frameworks: {cis_v8: "5.2"}

  - id: PW-03
    title: Minimum password age is at least 1 day
    platforms: [linux, windows]
    fact: password.min_age_days
    operator: gte
    expected: 1
    severity: low
    rationale: Stops users cycling straight back to an old password.
    remediation:
      linux: Set PASS_MIN_DAYS 1 in /etc/login.defs.
      windows: Set 'Minimum password age' to 1 or more days.
    reference: CIS-style password policy (mapping TBD)
    domain: identity
    frameworks: {cis_v8: "5.2"}

  - id: PW-04
    title: Password history remembers at least 24
    platforms: [windows]
    fact: password.history_size
    operator: gte
    expected: 24
    severity: medium
    rationale: Prevents password reuse.
    remediation:
      windows: Set 'Enforce password history' to 24 or more.
    reference: CIS-style password policy (mapping TBD)
    domain: identity
    frameworks: {cis_v8: "5.2", pci_dss_v4: "8.3.7"}

  - id: PW-05
    title: Password complexity is enabled
    platforms: [windows]
    fact: password.complexity_enabled
    operator: eq
    expected: true
    severity: medium
    remediation:
      windows: Enable 'Password must meet complexity requirements'.
    reference: CIS-style password policy (mapping TBD)
    domain: identity
    frameworks: {cis_v8: "5.2"}

  - id: PW-06
    title: Reversible password encryption is disabled
    platforms: [windows]
    fact: password.reversible_encryption
    operator: eq
    expected: false
    severity: high
    rationale: Reversible encryption is close to storing passwords in plain text.
    remediation:
      windows: Disable 'Store passwords using reversible encryption'.
    reference: CIS-style password policy (mapping TBD)
    domain: identity
    frameworks: {cis_v8: "4.1", pci_dss_v4: "8.3.2"}

  - id: LK-01
    title: Account lockout after 1 to 5 failed logins
    platforms: [linux, windows]
    fact: lockout.threshold
    operator: between
    expected: [1, 5]
    severity: high
    rationale: Without lockout, online password guessing is unlimited.
    remediation:
      linux: Set 'deny = 5' in /etc/security/faillock.conf and enable pam_faillock.
      windows: Set 'Account lockout threshold' to 5 or fewer, not 0.
    reference: CIS-style lockout policy (mapping TBD)
    domain: identity
    frameworks: {cis_v8: "4.10", pci_dss_v4: "8.3.4"}

  - id: LK-02
    title: Lockout duration is at least 15 minutes
    platforms: [linux, windows]
    fact: lockout.duration_minutes
    operator: gte
    expected: 15
    severity: medium
    remediation:
      linux: Set 'unlock_time = 900' in /etc/security/faillock.conf.
      windows: Set 'Account lockout duration' to 15 minutes or more.
    reference: CIS-style lockout policy (mapping TBD)
    domain: identity
    frameworks: {cis_v8: "4.10"}

  - id: AC-01
    title: Guest account is disabled
    platforms: [windows]
    fact: account.guest_enabled
    operator: eq
    expected: false
    severity: high
    remediation:
      # FIX(B-01, 8 Oct 2026, Ahmad): YAML failed to load because the text
      # contained "Accounts: Guest..." and an unquoted colon starts a new key.
      # Resolved by quoting the whole value. Lesson: quote any text with ":".
      windows: "Set 'Accounts: Guest account status' to Disabled."
    reference: CIS-style account policy (mapping TBD)
    domain: identity
    frameworks: {cis_v8: "4.7", pci_dss_v4: "2.2.2"}

  - id: SSH-01
    title: SSH root login is disabled
    platforms: [linux]
    fact: ssh.permit_root_login
    operator: eq
    expected: "no"
    severity: high
    remediation:
      linux: Set 'PermitRootLogin no' in /etc/ssh/sshd_config and reload sshd.
    reference: CIS-style SSH hardening (mapping TBD)
    domain: remote
    frameworks: {cis_v8: "5.4", pci_dss_v4: "2.2.6"}

  - id: SSH-02
    title: SSH max auth tries is 4 or fewer
    platforms: [linux]
    fact: ssh.max_auth_tries
    operator: lte
    expected: 4
    severity: medium
    remediation:
      linux: Set 'MaxAuthTries 4' in /etc/ssh/sshd_config and reload sshd.
    reference: CIS-style SSH hardening (mapping TBD)
    domain: remote
    frameworks: {cis_v8: "4.1", pci_dss_v4: "2.2.6"}

  - id: FS-01
    title: /etc/shadow is not world or group writable
    platforms: [linux]
    fact: file.etc_shadow.mode
    operator: in
    expected: ["0000", "0400", "0600", "0640"]
    severity: high
    remediation:
      linux: Run 'chmod 0640 /etc/shadow' (or 0000 on RHEL-family systems).
    reference: CIS-style file permissions (mapping TBD)
    domain: data
    frameworks: {cis_v8: "3.3", pci_dss_v4: "2.2.6"}

  - id: LK-03
    title: Lockout module pam_faillock is active
    platforms: [linux]
    fact: lockout.pam_enabled
    operator: eq
    expected: true
    severity: high
    rationale: faillock.conf has no effect unless pam_faillock is in the PAM stack.
    remediation:
      linux: Run 'sudo pam-auth-update --enable faillock' (Ubuntu) or 'authselect enable-feature with-faillock' (RHEL).
    reference: CIS-style lockout policy (mapping TBD)
    domain: identity
    frameworks: {cis_v8: "4.10", pci_dss_v4: "8.3.4"}

  - id: ID-01
    title: Screen locks after 15 minutes or less idle
    platforms: [windows]
    fact: session.lock_seconds
    operator: between
    expected: [1, 900]
    severity: medium
    rationale: A shared cashier or office PC left unlocked lets anyone act as the last user.
    remediation:
      windows: "Set 'Interactive logon: Machine inactivity limit' to 900 seconds or fewer."
    reference: CIS-style session policy (mapping TBD)
    domain: identity
    frameworks: {cis_v8: "4.3", pci_dss_v4: "8.2.8"}

  - id: SSH-03
    title: SSH password login is disabled (keys only)
    platforms: [linux]
    fact: ssh.password_authentication
    operator: eq
    expected: "no"
    severity: medium
    rationale: Key-only login stops password guessing against the shop server.
    remediation:
      linux: Set 'PasswordAuthentication no' in /etc/ssh/sshd_config (and any file in sshd_config.d), then reload sshd.
    reference: CIS-style SSH hardening (mapping TBD)
    domain: remote
    frameworks: {cis_v8: "4.1", pci_dss_v4: "2.2.6"}

  - id: RDP-01
    title: Remote Desktop is off or requires NLA
    platforms: [windows]
    fact: rdp.nla_or_disabled
    operator: eq
    expected: true
    severity: high
    rationale: RDP without Network Level Authentication exposes the login screen to attacks.
    remediation:
      windows: "Turn off Remote Desktop, or enable 'Require computers to use Network Level Authentication'."
    reference: CIS-style remote access (mapping TBD)
    domain: remote
    frameworks: {cis_v8: "4.1", pci_dss_v4: "2.2.6"}

  - id: NET-01
    title: Host firewall is enabled
    platforms: [linux, windows]
    fact: firewall.enabled
    operator: eq
    expected: true
    severity: high
    rationale: Without a host firewall every listening service is reachable from the shop network.
    remediation:
      linux: Run 'sudo ufw enable' after allowing needed ports (e.g. 'sudo ufw allow 22,80,443/tcp').
      windows: Turn on Windows Defender Firewall for the Domain, Private and Public profiles.
    reference: CIS-style firewall (mapping TBD)
    domain: network
    frameworks: {cis_v8: "4.5", pci_dss_v4: "1.5.1"}

  - id: NET-02
    title: SMBv1 is disabled
    platforms: [windows]
    fact: service.smb1_enabled
    operator: eq
    expected: false
    severity: high
    rationale: SMBv1 is the protocol abused by WannaCry-style worms.
    remediation:
      windows: Run 'Set-SmbServerConfiguration -EnableSMB1Protocol $false' as Administrator.
    reference: CIS-style unnecessary services (mapping TBD)
    domain: network
    frameworks: {cis_v8: "4.8", pci_dss_v4: "2.2.5"}

  - id: EP-01
    title: Antivirus real-time protection is on
    platforms: [windows]
    fact: av.realtime_enabled
    operator: eq
    expected: true
    severity: high
    rationale: A cashier PC handles USB sticks, email and web; real-time scanning is the last line of defence.
    remediation:
      windows: Turn on Real-time protection in Windows Security > Virus & threat protection.
    reference: CIS-style malware defence (mapping TBD)
    domain: endpoint
    frameworks: {cis_v8: "10.1", pci_dss_v4: "5.2.1"}

  - id: EP-02
    title: Antivirus signatures are at most 7 days old
    platforms: [windows]
    fact: av.signature_age_days
    operator: lte
    expected: 7
    severity: medium
    remediation:
      windows: Run 'Update-MpSignature' and check Windows Update is not paused.
    reference: CIS-style malware defence (mapping TBD)
    domain: endpoint
    frameworks: {cis_v8: "10.2", pci_dss_v4: "5.3.1"}

  - id: EP-03
    title: User Account Control (UAC) is enabled
    platforms: [windows]
    fact: uac.enabled
    operator: eq
    expected: true
    severity: high
    remediation:
      windows: "Set 'User Account Control: Run all administrators in Admin Approval Mode' to Enabled."
    reference: CIS-style endpoint hardening (mapping TBD)
    domain: endpoint
    frameworks: {cis_v8: "5.4", pci_dss_v4: "2.2.6"}

  - id: EP-04
    title: AutoRun is disabled for all drives
    platforms: [windows]
    fact: autorun.disabled_all
    operator: eq
    expected: true
    severity: medium
    rationale: Stops malware on a USB stick starting by itself when plugged into a till PC.
    remediation:
      windows: "Set 'Turn off AutoPlay' to Enabled for All drives (registry NoDriveTypeAutoRun = 255)."
    reference: CIS-style endpoint hardening (mapping TBD)
    domain: endpoint
    frameworks: {cis_v8: "10.3"}

  - id: PAT-01
    title: Automatic security updates are on
    platforms: [linux, windows]
    fact: updates.automatic
    operator: eq
    expected: true
    severity: high
    remediation:
      linux: Run 'sudo apt install unattended-upgrades && sudo dpkg-reconfigure -plow unattended-upgrades'.
      windows: Remove the 'NoAutoUpdate' policy so Windows Update installs updates automatically.
    reference: CIS-style patching (mapping TBD)
    domain: patching
    frameworks: {cis_v8: "7.3", pci_dss_v4: "6.3.3"}

  - id: PAT-02
    title: Last Windows update installed within 35 days
    platforms: [windows]
    fact: updates.days_since_last_patch
    operator: lte
    expected: 35
    severity: high
    rationale: Microsoft ships fixes monthly; older than one cycle means known holes stay open.
    remediation:
      windows: Run Windows Update and install all pending updates.
    reference: CIS-style patching (mapping TBD)
    domain: patching
    frameworks: {cis_v8: "7.3", pci_dss_v4: "6.3.3"}

  - id: LOG-01
    title: Audit daemon (auditd) is running
    platforms: [linux]
    fact: audit.service_active
    operator: eq
    expected: true
    severity: medium
    remediation:
      linux: Run 'sudo apt install auditd && sudo systemctl enable --now auditd'.
    reference: CIS-style logging (mapping TBD)
    domain: logging
    frameworks: {cis_v8: "8.2", pci_dss_v4: "10.2.1"}

  - id: LOG-02
    title: Logon events are audited (success and failure)
    platforms: [windows]
    fact: audit.logon_success_failure
    operator: eq
    expected: true
    severity: medium
    remediation:
      windows: Run 'auditpol /set /subcategory:"Logon" /success:enable /failure:enable' as Administrator.
    reference: CIS-style logging (mapping TBD)
    domain: logging
    frameworks: {cis_v8: "8.2", pci_dss_v4: "10.2.1"}

  - id: DATA-01
    title: System drive is encrypted with BitLocker
    platforms: [windows]
    fact: disk.encryption_on
    operator: eq
    expected: true
    severity: medium
    rationale: A stolen office PC must not expose customer or staff data.
    remediation:
      windows: Turn on BitLocker for the C drive (VMware VMs need a virtual TPM added first).
    reference: CIS-style data protection (mapping TBD)
    domain: data
    frameworks: {cis_v8: "3.11"}

  - id: WEB-01
    title: Web server hides its version (server_tokens off)
    platforms: [nginx]
    fact: web.server_tokens
    operator: eq
    expected: "off"
    severity: low
    rationale: Showing the exact nginx version helps attackers pick a matching exploit.
    remediation:
      linux: Add 'server_tokens off;' to the http block in /etc/nginx/nginx.conf and reload nginx.
    reference: CIS-style web server hardening (mapping TBD)
    domain: web
    frameworks: {cis_v8: "4.1", pci_dss_v4: "2.2.6"}

  - id: WEB-02
    title: Directory listing (autoindex) is off
    platforms: [nginx]
    fact: web.autoindex_enabled
    operator: eq
    expected: false
    severity: medium
    rationale: Directory listing can expose backups, invoices or config files of the shop.
    remediation:
      linux: Remove 'autoindex on;' from the nginx site config and reload nginx.
    reference: CIS-style web server hardening (mapping TBD)
    domain: web
    frameworks: {cis_v8: "4.8", pci_dss_v4: "2.2.4"}

  - id: WEB-03
    title: Online shop is served over HTTPS
    platforms: [nginx]
    fact: web.https_enabled
    operator: eq
    expected: true
    severity: high
    rationale: Customers send logins, addresses and payment details to the shop.
    remediation:
      linux: Add a 'listen 443 ssl;' server block with a certificate (self-signed is fine in the lab).
    reference: CIS-style web server hardening (mapping TBD)
    domain: web
    frameworks: {cis_v8: "3.10", pci_dss_v4: "4.2.1"}

  - id: WEB-04
    title: Old TLS versions (TLS 1.0/1.1, SSLv3) are disabled
    platforms: [nginx]
    fact: web.weak_tls_enabled
    operator: eq
    expected: false
    severity: high
    remediation:
      linux: Set 'ssl_protocols TLSv1.2 TLSv1.3;' in nginx.conf and every site, then reload nginx.
    reference: CIS-style web server hardening (mapping TBD)
    domain: web
    frameworks: {cis_v8: "3.10", pci_dss_v4: "4.2.1"}

  - id: WEB-05
    title: HSTS header is sent
    platforms: [nginx]
    fact: web.hsts_enabled
    operator: eq
    expected: true
    severity: low
    remediation:
      linux: "Add 'add_header Strict-Transport-Security \"max-age=31536000\" always;' to the HTTPS server block."
    reference: CIS-style web server hardening (mapping TBD)
    domain: web
    frameworks: {cis_v8: "3.10"}

  - id: DB-01
    title: Database does not listen on all interfaces
    platforms: [mysql]
    fact: db.bind_address
    operator: not_in
    expected: ["*", "0.0.0.0", "::"]
    severity: high
    rationale: The customer and order database should only accept connections from the shop server.
    remediation:
      linux: Set 'bind-address = 127.0.0.1' (or the private IP the web server uses) under [mysqld] and restart.
    reference: CIS-style database hardening (mapping TBD)
    domain: network
    frameworks: {cis_v8: "4.1", pci_dss_v4: "1.3.1"}

  - id: DB-02
    title: LOAD DATA LOCAL INFILE is disabled
    platforms: [mysql]
    fact: db.local_infile
    operator: eq
    expected: false
    severity: medium
    rationale: local_infile lets a compromised web app read files from the server.
    remediation:
      linux: Set 'local_infile = 0' under [mysqld] and restart the database.
    reference: CIS-style database hardening (mapping TBD)
    domain: data
    frameworks: {cis_v8: "4.1", pci_dss_v4: "2.2.6"}

  - id: DB-03
    title: Database requires encrypted connections
    platforms: [mysql]
    fact: db.secure_transport_required
    operator: eq
    expected: true
    severity: medium
    remediation:
      linux: Set 'require_secure_transport = ON' under [mysqld] (and give the server a TLS certificate).
    reference: CIS-style database hardening (mapping TBD)
    domain: data
    frameworks: {cis_v8: "3.10", pci_dss_v4: "4.2.1"}
